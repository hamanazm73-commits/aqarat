<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0c0d10"/>
      <stop offset="0.5" stop-color="#17191e"/>
      <stop offset="1" stop-color="#23262c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.26" r="0.45">
      <stop offset="0" stop-color="#e6b64c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e6b64c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="1270" cy="240" r="80" fill="#efd18a" opacity="0.9"/>

  <!-- distant skyline -->
  <g fill="#191b20" opacity="0.85">
    <rect x="40" y="560" width="90" height="340"/>
    <rect x="150" y="500" width="70" height="400"/>
    <rect x="240" y="600" width="110" height="300"/>
    <rect x="370" y="540" width="80" height="360"/>
    <rect x="1190" y="580" width="90" height="320"/>
    <rect x="1300" y="520" width="70" height="380"/>
    <rect x="1390" y="600" width="130" height="300"/>
  </g>

  <!-- near buildings + houses -->
  <g fill="#25282f">
    <rect x="470" y="620" width="130" height="280"/>
    <rect x="610" y="540" width="110" height="360"/>
    <rect x="735" y="470" width="130" height="430"/>
    <rect x="880" y="560" width="120" height="340"/>
    <rect x="1015" y="620" width="140" height="280"/>
  </g>

  <!-- pitched-roof houses in the foreground -->
  <g fill="none" stroke="#3a3e46" stroke-width="4">
    <path d="M300 760 L360 710 L420 760 L420 900 L300 900 Z" fill="#22252b"/>
    <path d="M1120 780 L1180 735 L1240 780 L1240 900 L1120 900 Z" fill="#22252b"/>
    <path d="M690 800 L740 762 L790 800 L790 900 L690 900 Z" fill="#20232a"/>
  </g>

  <!-- lit windows (gold) -->
  <g fill="#e6b64c" opacity="0.9">
    <rect x="760" y="500" width="16" height="22"/><rect x="790" y="500" width="16" height="22"/><rect x="820" y="500" width="16" height="22"/>
    <rect x="760" y="545" width="16" height="22"/><rect x="820" y="545" width="16" height="22"/>
    <rect x="650" y="575" width="14" height="20"/><rect x="680" y="575" width="14" height="20"/>
    <rect x="910" y="600" width="14" height="20"/><rect x="940" y="600" width="14" height="20"/>
    <rect x="345" y="800" width="12" height="16"/>
    <rect x="1165" y="820" width="12" height="16"/>
  </g>
</svg>
